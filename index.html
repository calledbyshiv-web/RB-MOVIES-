<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>RB MOVIES</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050706;
  --glass:rgba(25,32,27,.58);
  --line:rgba(255,255,255,.12);
  --muted:#a9b0aa;
  --green:#55d66f;
}

html{
  background:#050706;
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:#050706;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",Arial,sans-serif;
  overflow-x:hidden;
}

/* BACKGROUND */

body:before{
  content:"";
  position:fixed;
  z-index:-5;
  inset:-15%;
  background:
    radial-gradient(
      ellipse at 20% 15%,
      rgba(72,185,63,.65),
      transparent 32%
    ),
    radial-gradient(
      ellipse at 85% 35%,
      rgba(21,100,37,.7),
      transparent 35%
    ),
    radial-gradient(
      ellipse at 45% 80%,
      rgba(4,77,34,.6),
      transparent 35%
    ),
    linear-gradient(135deg,#071009,#071c0b,#020403);
  filter:blur(45px);
  transform:scale(1.15);
}

body:after{
  content:"";
  position:fixed;
  z-index:-4;
  inset:0;
  background:rgba(0,0,0,.28);
  pointer-events:none;
}

/* TOP */

.top{
  padding:
    calc(20px + env(safe-area-inset-top))
    18px
    10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back{
  width:43px;
  height:43px;
  border:0;
  background:rgba(255,255,255,.08);
  color:white;
  border-radius:50%;
  font-size:27px;
  cursor:pointer;
  backdrop-filter:blur(15px);
}

.logo{
  font-weight:900;
  letter-spacing:-1px;
  font-size:21px;
}

.logo span{
  color:#7bea88;
}

/* HERO */

.hero{
  padding:45px 20px 30px;
  text-align:center;
}

.hero-icon{
  font-size:43px;
  margin-bottom:20px;
  filter:drop-shadow(0 5px 15px rgba(0,0,0,.5));
}

.hero h1{
  font-size:38px;
  line-height:1.08;
  letter-spacing:-1.8px;
  font-weight:800;
  max-width:430px;
  margin:auto;
}

.hero p{
  margin-top:12px;
  color:#c0c8c1;
  font-size:14px;
}

/* SEARCH */

.search-wrap{
  padding:0 16px;
}

.search-box{
  height:62px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:32px;
  background:rgba(255,255,255,.09);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  display:flex;
  align-items:center;
  padding:0 20px;
  box-shadow:
    inset 0 1px rgba(255,255,255,.08),
    0 15px 45px rgba(0,0,0,.2);
}

.search-icon{
  font-size:24px;
  margin-right:13px;
  opacity:.7;
}

.search{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:17px;
}

.search::placeholder{
  color:rgba(255,255,255,.38);
}

/* CONTENT */

.container{
  padding:50px 16px 120px;
  max-width:1100px;
  margin:auto;
}

.section-title{
  font-size:28px;
  font-weight:800;
  letter-spacing:-.8px;
  margin-bottom:20px;
}

.section-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.see-all{
  border:0;
  background:transparent;
  color:#b8c0b9;
  font-size:13px;
  cursor:pointer;
}

/* CATEGORY */

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:30px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  white-space:nowrap;
  padding:10px 16px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:#aaa;
  cursor:pointer;
  backdrop-filter:blur(12px);
}

.cat.active{
  background:white;
  color:#111;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

/* CARD */

.card{
  min-width:0;
  cursor:pointer;
  position:relative;
}

.poster{
  height:300px;
  border-radius:19px;
  overflow:hidden;
  position:relative;
  background:#182019;
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 12px 30px rgba(0,0,0,.28);
  transition:.25s ease;
}

.card:hover .poster{
  transform:translateY(-5px);
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}

.poster:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 70% 20%,
      rgba(255,255,255,.3),
      transparent 20%
    ),
    linear-gradient(
      to bottom,
      transparent 40%,
      rgba(0,0,0,.9)
    );
}

.poster-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:16px;
}

.poster-icon{
  font-size:58px;
  margin-bottom:auto;
  padding-top:25px;
  text-align:center;
  filter:drop-shadow(0 7px 15px rgba(0,0,0,.5));
}

.poster-title{
  font-size:18px;
  line-height:1.05;
  font-weight:900;
  text-shadow:0 3px 12px #000;
}

.poster-year{
  font-size:12px;
  color:#ddd;
  margin-top:7px;
}

.favorite{
  position:absolute;
  right:10px;
  top:10px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.45);
  color:white;
  backdrop-filter:blur(10px);
  cursor:pointer;
  z-index:4;
  font-size:17px;
}

.card-info{
  padding:11px 3px 0;
}

.card-name{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  margin-top:5px;
  color:#9ba19c;
  font-size:12px;
}

.rating{
  color:#ffd966;
}

/* DIFFERENT POSTERS */

.p1{
  background:
    radial-gradient(circle at 50% 30%,#ffdb82,transparent 20%),
    linear-gradient(145deg,#61390b,#101308 55%,#2b5a20);
}

.p2{
  background:
    radial-gradient(circle at 55% 25%,#d51c27,transparent 22%),
    linear-gradient(145deg,#151b52,#07110b 55%,#5e090e);
}

.p3{
  background:
    radial-gradient(circle at 55% 28%,#ffe7a0,transparent 18%),
    linear-gradient(145deg,#6c1d17,#14100b 55%,#321006);
}

.p4{
  background:
    radial-gradient(circle at 60% 22%,#9e67ff,transparent 23%),
    linear-gradient(145deg,#211049,#070a12 60%,#12345c);
}

.p5{
  background:
    radial-gradient(circle at 45% 25%,#65e59d,transparent 22%),
    linear-gradient(145deg,#123d29,#07120c 60%,#0d563c);
}

.p6{
  background:
    radial-gradient(circle at 50% 20%,#ff6095,transparent 22%),
    linear-gradient(145deg,#54152e,#10070d 60%,#290b24);
}

.p7{
  background:
    radial-gradient(circle at 50% 25%,#fff1bf,transparent 20%),
    linear-gradient(145deg,#40351a,#0a0c0a 55%,#192f23);
}

.p8{
  background:
    radial-gradient(circle at 50% 25%,#54b9ff,transparent 23%),
    linear-gradient(145deg,#092d54,#050a12 55%,#132b51);
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  padding:80px 20px;
  text-align:center;
  color:#89908a;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  z-index:300;
  left:14px;
  right:14px;
  bottom:
    calc(13px + env(safe-area-inset-bottom));
  height:76px;
  border-radius:39px;
  background:rgba(25,31,28,.75);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  display:flex;
  align-items:center;
  justify-content:space-around;
  box-shadow:0 15px 45px rgba(0,0,0,.45);
}

.nav-btn{
  border:0;
  background:transparent;
  color:#929992;
  min-width:55px;
  height:62px;
  border-radius:30px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
}

.nav-btn span{
  font-size:22px;
}

.nav-btn small{
  font-size:9px;
}

.nav-btn.active{
  color:white;
  background:rgba(255,255,255,.13);
}

/* MODAL */

.modal{
  position:fixed;
  z-index:500;
  inset:0;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(650px,100%);
  max-height:88vh;
  overflow:auto;
  border-radius:28px 28px 0 0;
  background:#111612;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 -20px 80px #000;
}

.modal-poster{
  height:310px;
  position:relative;
  display:flex;
  align-items:flex-end;
  padding:25px;
}

.modal-poster:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    #111612,
    transparent 70%
  );
}

.modal-poster-title{
  position:relative;
  z-index:2;
  font-size:32px;
  font-weight:900;
}

.close{
  position:absolute;
  z-index:5;
  right:15px;
  top:15px;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:white;
  font-size:25px;
  cursor:pointer;
}

.modal-content{
  padding:5px 22px 30px;
}

.modal-info{
  color:#aeb6af;
  line-height:1.6;
  margin-top:10px;
}

.action-row{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.action-row button,
.watch-btn{
  flex:1;
  border:0;
  padding:14px;
  border-radius:25px;
  text-align:center;
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
}

.watch-btn{
  background:white;
  color:#111;
}

.fav-btn{
  background:#263029;
  color:white;
}

.notice{
  color:#6f776f;
  font-size:11px;
  line-height:1.5;
  margin-top:15px;
}

/* RESPONSIVE */

@media(max-width:850px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .poster{
    height:270px;
  }
}

@media(max-width:600px){

  .hero{
    padding-top:42px;
  }

  .hero h1{
    font-size:35px;
  }

  .container{
    padding-top:43px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:13px;
  }

  .poster{
    height:245px;
    border-radius:17px;
  }

  .poster-title{
    font-size:17px;
  }

  .poster-icon{
    font-size:50px;
  }

  .section-title{
    font-size:25px;
  }

  .card-name{
    font-size:14px;
  }
}

@media(min-width:900px){
  .bottom-nav{
    width:500px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }
}
</style>
</head>

<body>

<!-- TOP -->

<div class="top">

  <button class="back" onclick="history.back()">‹</button>

  <div class="logo">
    RB <span>MOVIES</span> 🎬
  </div>

  <div style="width:43px"></div>

</div>


<!-- HERO -->

<section class="hero">

  <div class="hero-icon">🎬</div>

  <h1>
    What are you in the mood for?
  </h1>

  <p>
    Discover movies & TV shows you'll love.
  </p>

</section>


<!-- SEARCH -->

<div class="search-wrap">

  <div class="search-box">

    <span class="search-icon">⌕</span>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search for movies & TV shows..."
    >

  </div>

</div>


<!-- MAIN -->

<main class="container">

  <div class="categories">

    <button class="cat active" data-cat="All">
      All
    </button>

    <button class="cat" data-cat="Bollywood">
      🇮🇳 Bollywood
    </button>

    <button class="cat" data-cat="Hollywood">
      🇺🇸 Hollywood
    </button>

    <button class="cat" data-cat="South">
      🔥 South
    </button>

    <button class="cat" data-cat="Hindi Dubbed">
      🎙️ Hindi Dubbed
    </button>

    <button class="cat" data-cat="Favorites">
      ❤️ Favorites
    </button>

  </div>


  <div class="section-row">

    <h2 class="section-title" id="sectionTitle">
      Trending Today
    </h2>

    <button class="see-all" onclick="setCategory('All')">
      See all
    </button>

  </div>


  <div id="movies" class="grid"></div>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button class="nav-btn active" data-nav="home">
    <span>⌂</span>
    <small>Home</small>
  </button>

  <button class="nav-btn" data-nav="movies">
    <span>▣</span>
    <small>Movies</small>
  </button>

  <button class="nav-btn" data-nav="tv">
    <span>▤</span>
    <small>TV</small>
  </button>

  <button class="nav-btn" data-nav="favorites">
    <span>♡</span>
    <small>Watchlist</small>
  </button>

  <button class="nav-btn" data-nav="search">
    <span>⌕</span>
    <small>Search</small>
  </button>

</nav>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
  onclick="outsideClose(event)"
>

  <div class="modal-box">

    <button class="close" onclick="closeModal()">
      ×
    </button>

    <div id="modalPoster" class="modal-poster"></div>

    <div class="modal-content">

      <h2 id="modalTitle"></h2>

      <p id="modalInfo" class="modal-info"></p>

      <p id="modalDescription" class="modal-info"></p>

      <div class="action-row">

        <button
          id="favButton"
          class="fav-btn"
          onclick="favoriteFromModal()"
        >
          ♡ Add to Watchlist
        </button>

        <a
          id="officialSearch"
          class="watch-btn"
          target="_blank"
          rel="noopener noreferrer"
        >
          Find Official Watch
        </a>

      </div>

      <div class="notice">
        RB Movies is a movie discovery interface.
        Viewing options are directed to official/legal sources.
      </div>

    </div>

  </div>

</div>


<script>

/* MOVIE DATA */

const movies = [

  {
    title:"Spider-Man: Brand New Day",
    cat:"Hollywood",
    year:2026,
    rating:"7.9",
    genre:"Action",
    poster:"p2",
    icon:"🕷️",
    desc:"Discover this title and check official services for availability."
  },

  {
    title:"Toy Story",
    cat:"Hollywood",
    year:2026,
    rating:"8.8",
    genre:"Animation",
    poster:"p1",
    icon:"🤠",
    desc:"An animated movie discovery listing."
  },

  {
    title:"Action Storm",
    cat:"Bollywood",
    year:2026,
    rating:"8.4",
    genre:"Action",
    poster:"p3",
    icon:"🔥",
    desc:"A Bollywood action discovery listing."
  },

  {
    title:"The Last Mission",
    cat:"Hollywood",
    year:2026,
    rating:"8.7",
    genre:"Action",
    poster:"p8",
    icon:"⚡",
    desc:"A Hollywood action discovery listing."
  },

  {
    title:"Midnight Mystery",
    cat:"Hollywood",
    year:2025,
    rating:"8.4",
    genre:"Thriller",
    poster:"p4",
    icon:"🌙",
    desc:"A thriller movie discovery listing."
  },

  {
    title:"Dil Se",
    cat:"Bollywood",
    year:2025,
    rating:"8.1",
    genre:"Drama",
    poster:"p5",
    icon:"❤️",
    desc:"A Bollywood drama discovery listing."
  },

  {
    title:"South Warrior",
    cat:"South",
    year:2026,
    rating:"8.8",
    genre:"Action",
    poster:"p3",
    icon:"⚔️",
    desc:"A South Indian action discovery listing."
  },

  {
    title:"Kingdom",
    cat:"South",
    year:2026,
    rating:"8.6",
    genre:"Adventure",
    poster:"p7",
    icon:"👑",
    desc:"A South Indian adventure discovery listing."
  },

  {
    title:"Galaxy",
    cat:"Hollywood",
    year:2026,
    rating:"8.8",
    genre:"Sci-Fi",
    poster:"p8",
    icon:"🚀",
    desc:"A science-fiction movie discovery listing."
  },

  {
    title:"Love Again",
    cat:"Bollywood",
    year:2025,
    rating:"7.9",
    genre:"Romance",
    poster:"p6",
    icon:"💜",
    desc:"A romantic movie discovery listing."
  },

  {
    title:"Shadow",
    cat:"Hindi Dubbed",
    year:2026,
    rating:"8.6",
    genre:"Action",
    poster:"p1",
    icon:"🥷",
    desc:"A Hindi-dubbed action discovery listing."
  },

  {
    title:"The Hunter",
    cat:"Hindi Dubbed",
    year:2025,
    rating:"8.2",
    genre:"Thriller",
    poster:"p6",
    icon:"🎯",
    desc:"A Hindi-dubbed thriller discovery listing."
  }

];


let category="All";

let favorites=JSON.parse(
  localStorage.getItem("rbFavorites") || "[]"
);

let selectedMovie=null;


/* CATEGORY */

document
.querySelectorAll(".cat")
.forEach(button=>{

  button.addEventListener("click",()=>{

    setCategory(button.dataset.cat);

  });

});


function setCategory(cat){

  category=cat;

  document
  .querySelectorAll(".cat")
  .forEach(button=>{

    button.classList.toggle(
      "active",
      button.dataset.cat===cat
    );

  });

  document.getElementById("sectionTitle")
  .textContent =
    cat==="All"
    ? "Trending Today"
    : cat==="Favorites"
    ? "Your Watchlist"
    : cat;

  renderMovies();

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
  "input",
  renderMovies
);


/* FAVORITE */

function toggleFavorite(index){

  const title=movies[index].title;

  if(favorites.includes(title)){

    favorites=favorites.filter(
      item=>item!==title
    );

  }else{

    favorites.push(title);

  }

  localStorage.setItem(
    "rbFavorites",
    JSON.stringify(favorites)
  );

  renderMovies();

  if(selectedMovie!==null){

    updateFavoriteButton();

  }

}


function favoriteFromModal(){

  if(selectedMovie===null)return;

  toggleFavorite(selectedMovie);

}


function updateFavoriteButton(){

  const button=
    document.getElementById("favButton");

  const title=
    movies[selectedMovie].title;

  button.textContent=
    favorites.includes(title)
    ? "♥ Remove from Watchlist"
    : "♡ Add to Watchlist";

}


/* OPEN */

function openMovie(index){

  selectedMovie=index;

  const movie=movies[index];

  const poster=
    document.getElementById("modalPoster");

  poster.className=
    "modal-poster "+movie.poster;

  poster.innerHTML=`
    <div class="modal-poster-title">
      ${movie.title}
    </div>
  `;

  document
  .getElementById("modalTitle")
  .textContent=movie.title;

  document
  .getElementById("modalInfo")
  .textContent=
    "⭐ "+movie.rating+
    "  •  "+movie.year+
    "  •  "+movie.cat+
    "  •  "+movie.genre;

  document
  .getElementById("modalDescription")
  .textContent=movie.desc;

  document
  .getElementById("officialSearch")
  .href=
    "https://www.google.com/search?q="+
    encodeURIComponent(
      movie.title+
      " official where to watch"
    );

  updateFavoriteButton();

  document
  .getElementById("modal")
  .classList.add("show");

}


function closeModal(){

  document
  .getElementById("modal")
  .classList.remove("show");

  selectedMovie=null;

}


function outsideClose(event){

  if(
    event.target===
    document.getElementById("modal")
  ){

    closeModal();

  }

}


/* RENDER */

function renderMovies(){

  const query=
    document
    .getElementById("search")
    .value
    .trim()
    .toLowerCase();

  let list=
    movies
    .map((movie,index)=>({
      movie,
      index
    }))
    .filter(item=>{

      const movie=item.movie;

      const categoryMatch=
        category==="All" ||
        (
          category==="Favorites" &&
          favorites.includes(movie.title)
        ) ||
        movie.cat===category;

      const searchMatch=
        movie.title
        .toLowerCase()
        .includes(query) ||

        movie.cat
        .toLowerCase()
        .includes(query) ||

        movie.genre
        .toLowerCase()
        .includes(query) ||

        String(movie.year)
        .includes(query);

      return categoryMatch && searchMatch;

    });


  list.sort(
    (a,b)=>
      Number(b.movie.rating)-
      Number(a.movie.rating)
  );


  const box=
    document.getElementById("movies");


  if(!list.length){

    box.innerHTML=`
      <div class="empty">
        <div style="font-size:45px">🔎</div>
        <br>
        No movies found
      </div>
    `;

    return;

  }


  box.innerHTML=
    list.map(item=>{

      const movie=item.movie;
      const index=item.index;

      const liked=
        favorites.includes(movie.title);

      return`

        <article
          class="card"
          data-index="${index}"
        >

          <div class="poster ${movie.poster}">

            <button
              class="favorite"
              data-fav="${index}"
            >
              ${liked?"♥":"♡"}
            </button>

            <div class="poster-content">

              <div class="poster-icon">
                ${movie.icon}
              </div>

              <div class="poster-title">
                ${movie.title}
              </div>

              <div class="poster-year">
                ${movie.year} • ${movie.genre}
              </div>

            </div>

          </div>

          <div class="card-info">

            <div class="card-name">
              ${movie.title}
            </div>

            <div class="card-meta">
              <span class="rating">
                ⭐ ${movie.rating}
              </span>
              &nbsp;•&nbsp;
              ${movie.year}
            </div>

          </div>

        </article>

      `;

    }).join("");


  document
  .querySelectorAll(".card")
  .forEach(card=>{

    card.addEventListener(
      "click",
      ()=>{
        openMovie(
          Number(card.dataset.index)
        );
      }
    );

  });


  document
  .querySelectorAll("[data-fav]")
  .forEach(button=>{

    button.addEventListener(
      "click",
      event=>{

        event.stopPropagation();

        toggleFavorite(
          Number(button.dataset.fav)
        );

      }
    );

  });

}


/* BOTTOM NAV */

document
.querySelectorAll(".nav-btn")
.forEach(button=>{

  button.addEventListener("click",()=>{

    document
    .querySelectorAll(".nav-btn")
    .forEach(b=>
      b.classList.remove("active")
    );

    button.classList.add("active");

    const nav=button.dataset.nav;

    if(nav==="home"){

      setCategory("All");

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }

    if(nav==="movies"){

      setCategory("All");

      document
      .getElementById("movies")
      .scrollIntoView({
        behavior:"smooth"
      });

    }

    if(nav==="tv"){

      alert(
        "📺 TV Shows section coming soon!"
      );

    }

    if(nav==="favorites"){

      setCategory("Favorites");

    }

    if(nav==="search"){

      document
      .getElementById("search")
      .focus();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }

  });

});


/* SEARCH ENTER */

document
.getElementById("search")
.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      document
      .getElementById("movies")
      .scrollIntoView({
        behavior:"smooth"
      });

    }

  }
);


/* ESC */

document.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Escape"){
      closeModal();
    }

  }
);


/* START */

renderMovies();

</script>

</body>
</html>
