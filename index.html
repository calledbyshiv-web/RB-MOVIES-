<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RB Movies 🎬</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 15px;text-align:center;background:#111;position:sticky;top:0;z-index:10}
h1{margin:0 0 15px;color:#e50914}
.search{width:100%;max-width:650px;padding:14px 18px;border:0;border-radius:30px;font-size:16px}
nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#111}
button{border:0;border-radius:20px;padding:10px 15px;cursor:pointer}
.hero{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#260000,#080808)}
.hero h2{font-size:30px;margin:5px}
.hero p{color:#aaa}
.controls{display:flex;gap:10px;padding:15px;overflow:auto}
.grid{padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:#151515;border-radius:14px;overflow:hidden;transition:.2s;cursor:pointer}
.card:hover{transform:translateY(-4px)}
.poster{height:220px;background:linear-gradient(135deg,#333,#111);display:flex;align-items:center;justify-content:center;font-size:45px}
.card h3{margin:10px;font-size:16px}
.card p{margin:8px 10px;color:#aaa;font-size:13px}
.rating{display:inline-block;margin:0 10px 5px;padding:5px 8px;background:#e50914;border-radius:6px;font-size:12px}
.genre{display:inline-block;margin:0 10px 10px;color:#aaa;font-size:12px}
.favorite{float:right;background:none;color:white;font-size:20px;padding:5px}
.empty{text-align:center;padding:50px;color:#888}
footer{text-align:center;padding:30px;color:#777}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
z-index:100;
align-items:center;
justify-content:center;
padding:20px
}

.modal-box{
background:#171717;
max-width:500px;
width:100%;
border-radius:18px;
padding:25px;
position:relative;
box-shadow:0 10px 40px #000
}

.close{
position:absolute;
right:15px;
top:10px;
background:#333;
color:#fff;
font-size:20px
}

.modal-poster{
height:180px;
border-radius:12px;
background:linear-gradient(135deg,#444,#111);
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
margin-bottom:20px
}

.watch{
display:block;
text-align:center;
margin-top:20px;
padding:13px;
border-radius:25px;
background:#e50914;
color:white;
text-decoration:none
}
</style>
</head>

<body>

<header>
<h1>🎬 RB MOVIES</h1>
<input id="search" class="search" placeholder="🔍 Search movies...">
</header>

<nav>
<button onclick="setCategory('All')">All</button>
<button onclick="setCategory('Bollywood')">Bollywood</button>
<button onclick="setCategory('Hollywood')">Hollywood</button>
<button onclick="setCategory('South')">South</button>
<button onclick="setCategory('Hindi Dubbed')">Hindi Dubbed</button>
<button onclick="setCategory('Favorites')">❤️ Favorites</button>
</nav>

<section class="hero">
<h2>🔥 Trending Movies</h2>
<p>Discover movies by category, rating and year</p>
</section>

<div class="controls">
<button onclick="sortMovies('rating')">⭐ Rating</button>
<button onclick="sortMovies('year')">📅 Newest</button>
<button onclick="sortMovies('title')">🔤 A-Z</button>
</div>

<div id="movies" class="grid"></div>

<footer>
<p>© 2026 RB Movies</p>
<p>Movie discovery platform • Legal content only</p>
</footer>

<div id="modal" class="modal" onclick="closeModal(event)">
<div class="modal-box">

<button class="close" onclick="closeModal()">×</button>

<div class="modal-poster">🎬</div>

<h2 id="modalTitle"></h2>

<p id="modalInfo"></p>

<p id="modalDescription"></p>

<button id="favButton" onclick="favoriteFromModal()">
❤️ Add to Favorites
</button>

<a class="watch" href="#" onclick="return false">
🔗 Where to Watch — Coming Soon
</a>

</div>
</div>

<script>

const movies=[
["Bollywood Action","Bollywood",2026,"8.4","Action","An action-packed Bollywood movie discovery listing."],
["Bollywood Drama","Bollywood",2025,"8.1","Drama","A dramatic Bollywood movie listing."],
["Bollywood Comedy","Bollywood",2026,"7.9","Comedy","A fun Bollywood comedy listing."],
["Bollywood Thriller","Bollywood",2025,"8.3","Thriller","A suspenseful Bollywood thriller listing."],
["Bollywood Romance","Bollywood",2024,"7.8","Romance","A romantic Bollywood movie listing."],
["Bollywood Mystery","Bollywood",2026,"8.0","Mystery","A mysterious Bollywood movie listing."],

["Hollywood Action","Hollywood",2026,"8.7","Action","A high-energy Hollywood action listing."],
["Hollywood Adventure","Hollywood",2025,"8.3","Adventure","An adventurous Hollywood movie listing."],
["Hollywood Sci-Fi","Hollywood",2026,"8.8","Sci-Fi","A futuristic Hollywood sci-fi listing."],
["Hollywood Thriller","Hollywood",2025,"8.4","Thriller","A suspenseful Hollywood thriller listing."],
["Hollywood Comedy","Hollywood",2024,"7.7","Comedy","A Hollywood comedy listing."],
["Hollywood Mystery","Hollywood",2026,"8.2","Mystery","A Hollywood mystery listing."],

["South Action","South",2026,"8.8","Action","A powerful South Indian action listing."],
["South Thriller","South",2025,"8.5","Thriller","A South Indian thriller listing."],
["South Drama","South",2026,"8.2","Drama","A South Indian drama listing."],
["South Comedy","South",2025,"7.9","Comedy","A South Indian comedy listing."],
["South Mystery","South",2024,"8.1","Mystery","A South Indian mystery listing."],
["South Adventure","South",2026,"8.6","Adventure","A South Indian adventure listing."],

["Hindi Dubbed Action","Hindi Dubbed",2026,"8.6","Action","A Hindi-dubbed action movie listing."],
["Hindi Dubbed Thriller","Hindi Dubbed",2025,"8.2","Thriller","A Hindi-dubbed thriller listing."],
["Hindi Dubbed Adventure","Hindi Dubbed",2026,"8.5","Adventure","A Hindi-dubbed adventure listing."],
["Hindi Dubbed Sci-Fi","Hindi Dubbed",2025,"8.0","Sci-Fi","A Hindi-dubbed sci-fi listing."],
["Hindi Dubbed Drama","Hindi Dubbed",2024,"7.8","Drama","A Hindi-dubbed drama listing."],
["Hindi Dubbed Mystery","Hindi Dubbed",2026,"8.3","Mystery","A Hindi-dubbed mystery listing."],

["Bollywood Crime","Bollywood",2026,"8.5","Crime","A Bollywood crime movie listing."],
["Bollywood Family","Bollywood",2025,"7.9","Family","A Bollywood family movie listing."],
["Hollywood Crime","Hollywood",2026,"8.6","Crime","A Hollywood crime movie listing."],
["Hollywood Family","Hollywood",2025,"7.8","Family","A Hollywood family movie listing."],
["South Crime","South",2026,"8.4","Crime","A South Indian crime movie listing."],
["South Family","South",2025,"7.7","Family","A South Indian family movie listing."],
["Hindi Dubbed Crime","Hindi Dubbed",2026,"8.4","Crime","A Hindi-dubbed crime movie listing."],
["Hindi Dubbed Family","Hindi Dubbed",2025,"7.9","Family","A Hindi-dubbed family movie listing."],
["Bollywood Sports","Bollywood",2024,"8.0","Sports","A Bollywood sports movie listing."],
["Hollywood Sports","Hollywood",2025,"8.1","Sports","A Hollywood sports movie listing."],
["South Sports","South",2024,"8.2","Sports","A South Indian sports movie listing."],
["Hindi Dubbed Sports","Hindi Dubbed",2025,"8.0","Sports","A Hindi-dubbed sports movie listing."]
];

let category="All";
let sortBy="rating";
let favorites=JSON.parse(localStorage.getItem("rbFavorites")||"[]");
let selectedMovie=null;

function setCategory(cat){
category=cat;
showMovies();
}

function sortMovies(type){
sortBy=type;
showMovies();
}

function toggleFavorite(title){
if(favorites.includes(title)){
favorites=favorites.filter(x=>x!==title);
}else{
favorites.push(title);
}
localStorage.setItem("rbFavorites",JSON.stringify(favorites));
showMovies();
}

function openMovie(index){
selectedMovie=index;

const m=movies[index];

document.getElementById("modalTitle").textContent=m[0];

document.getElementById("modalInfo").textContent=
"⭐ "+m[3]+"   •   "+m[2]+"   •   "+m[1]+"   •   "+m[4];

document.getElementById("modalDescription").textContent=m[5];

document.getElementById("favButton").textContent=
favorites.includes(m[0])
?"❤️ Remove from Favorites"
:"❤️ Add to Favorites";

document.getElementById("modal").style.display="flex";
}

function favoriteFromModal(){
if(selectedMovie===null)return;

toggleFavorite(movies[selectedMovie][0]);

document.getElementById("favButton").textContent=
favorites.includes(movies[selectedMovie][0])
?"❤️ Remove from Favorites"
:"❤️ Add to Favorites";
}

function closeModal(event){

if(event && event.target!==document.getElementById("modal"))return;

document.getElementById("modal").style.display="none";
}

function showMovies(){

const query=document.getElementById("search").value.toLowerCase();

let list=movies.map((m,i)=>({m,i})).filter(x=>{

const m=x.m;

const matchesCategory=
category==="All" ||
(category==="Favorites" && favorites.includes(m[0])) ||
m[1]===category;

const matchesSearch=
m[0].toLowerCase().includes(query) ||
m[1].toLowerCase().includes(query) ||
m[3].includes(query) ||
m[4].toLowerCase().includes(query) ||
String(m[2]).includes(query);

return matchesCategory && matchesSearch;
});

if(sortBy==="rating")
list.sort((a,b)=>Number(b.m[3])-Number(a.m[3]));

if(sortBy==="year")
list.sort((a,b)=>b.m[2]-a.m[2]);

if(sortBy==="title")
list.sort((a,b)=>a.m[0].localeCompare(b.m[0]));

const box=document.getElementById("movies");

if(!list.length){
box.innerHTML='<div class="empty">😕 No movies found</div>';
return;
}

box.innerHTML=list.map(x=>{

const m=x.m;
const i=x.i;
const liked=favorites.includes(m[0]);

return `
<div class="card" onclick="openMovie(${i})">

<div class="poster">🎬</div>

<button class="favorite"
onclick="event.stopPropagation();toggleFavorite('${m[0]}')">
${liked?"❤️":"♡"}
</button>

<h3>${m[0]}</h3>

<span class="rating">⭐ ${m[3]}</span>

<p>${m[1]} • ${m[2]}</p>

<span class="genre">🎭 ${m[4]}</span>

</div>
`;

}).join("");

}

document.getElementById("search").addEventListener("input",showMovies);

showMovies();

</script>

</body>
</html>
